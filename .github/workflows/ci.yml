name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [ci-debug, ci-asan]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Widen the ASan shadow mapping
        if: matrix.preset == 'ci-asan'
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      - name: Show toolchain
        run: |
          cmake --version
          ninja --version
          $CXX --version

      - name: Configure, build and test
        run: cmake --workflow --preset ${{ matrix.preset }}

  ci:
    name: CI
    if: always()
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check build matrix
        if: needs.build.result != 'success'
        run: exit 1
